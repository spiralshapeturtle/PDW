name: Build PDW (Win32)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    # Promoted to job-level env so the signing step's `if:` can test it
    # (the `secrets` context is not available in a step `if:`, and a step's
    # own `env:` block is not visible to that same step's `if:`).
    env:
      SIGN_CERT_PFX_BASE64: ${{ secrets.SIGN_CERT_PFX_BASE64 }}
      SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Win32 / Release)
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --target PDW

      # Authenticode signing to clear the Defender Wacatac.C!ml false positive.
      # Unsigned + low-prevalence binaries score high on Defender's ML heuristic;
      # a valid signature (ideally an EV cert) gives immediate SmartScreen reputation.
      #
      # SETUP REQUIRED before this does anything (it self-skips until then):
      #   1. Base64-encode your code-signing .pfx:
      #        [Convert]::ToBase64String([IO.File]::ReadAllBytes("cert.pfx")) > cert.txt
      #   2. Add repo secrets (Settings > Secrets and variables > Actions):
      #        SIGN_CERT_PFX_BASE64  = contents of cert.txt
      #        SIGN_CERT_PASSWORD    = the .pfx password
      #   3. (EV/HSM certs use a different flow - swap in your provider's signtool args.)
      - name: Sign binary (Authenticode)
        if: ${{ env.SIGN_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object { $_.FullName -match '\\x64\\' } |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign `
            /f $pfx /p $env:SIGN_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /d "PDW - POCSAG/FLEX paging decoder" `
            "build\Release\PDW.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed ($LASTEXITCODE)" }
          Remove-Item $pfx -Force
          & $signtool verify /pa /v "build\Release\PDW.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDW-Win32-Release
          path: build\Release\PDW.exe
          if-no-files-found: error
